<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АСВ-ОПТИМ: Модель выбора стратегии</title>
    <!-- Подключаем библиотеку для чтения CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px 20px; cursor: pointer; font-weight: bold; color: #7f8c8d; }
        .tab.active { color: #3498db; border-bottom: 3px solid #3498db; }
        .content { display: none; }
        .content.active { display: block; }
        .input-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="number"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px;}
        button:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #ecf0f1; color: #2c3e50; }
        .best { background-color: #d4edda; font-weight: bold; }
        .result { text-align: center; font-size: 18px; margin-top: 20px; color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 АСВ-ОПТИМ</h1>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('single')">Одиночный расчет</div>
            <div class="tab" onclick="switchTab('batch')">Массовый расчет (Excel/CSV)</div>
        </div>

        <!-- Вкладка 1: Одиночный расчет -->
        <div id="single" class="content active">
            <div class="input-group">
                <label>Номинал актива (руб.):</label>
                <input type="number" id="nominal" value="917185851">
            </div>
            <button onclick="calculateSingle()">Рассчитать</button>
            <table id="singleTable" style="display: none;">
                <thead><tr><th>Стратегия</th><th>ER (руб.)</th><th>ENPV (руб.)</th></tr></thead>
                <tbody id="singleBody"></tbody>
            </table>
            <div id="singleBest" class="result" style="display: none;"></div>
        </div>

        <!-- Вкладка 2: Массовый расчет -->
        <div id="batch" class="content">
            <div class="input-group">
                <label>Загрузите CSV файл (разделитель - запятая). Столбцы: Актив, Номинал</label>
                <input type="file" id="csvFile" accept=".csv">
                <p style="font-size: 12px; color: #666; margin-top: 5px;">Пример: <i>Банк А, 500000000</i></p>
            </div>
            <table id="batchTable" style="display: none;">
                <thead><tr><th>Актив</th><th>Лучшая стратегия</th><th>ER (руб.)</th><th>ENPV (руб.)</th></tr></thead>
                <tbody id="batchBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // Логика расчета
        function getStrategies(nominal, r) {
            return [
                { name: 'Реализация на торгах', costs: nominal * 0.15, scenarios: [[0.3, nominal], [0.7, 0]], cash_flows: [0, nominal * 0.3] },
                { name: 'Публичное предложение', costs: nominal * 0.10, scenarios: [[0.7, 52000000], [0.3, 0]], cash_flows: [0, 52000000] },
                { name: 'Продолжение взыскания', costs: nominal * 0.20, scenarios: [[0.4, nominal], [0.6, 0]], cash_flows: [0, 0, nominal * 0.4] },
                { name: 'Передача в отступное', costs: nominal * 0.05, scenarios: [[0.5, nominal * 0.5], [0.5, 0]], cash_flows: [0, nominal * 0.5] }
            ];
        }

        function processStrategies(strategies, r) {
            return strategies.map(s => {
                let er = s.scenarios.reduce((sum, [p, cf]) => sum + p * cf, 0) - s.costs;
                let enpv = 0;
                s.cash_flows.forEach((cf, t) => {
                    let cost_t = s.costs / s.cash_flows.length;
                    enpv += (cf - cost_t) / Math.pow(1 + r, t);
                });
                return { name: s.name, er: er, enpv: enpv };
            }).sort((a, b) => b.enpv - a.enpv);
        }

        // Одиночный расчет
        function calculateSingle() {
            const nominal = parseFloat(document.getElementById('nominal').value);
            if (isNaN(nominal) || nominal <= 0) { alert("Введите корректный номинал"); return; }
            
            const results = processStrategies(getStrategies(nominal, 0.15), 0.15);
            const tbody = document.getElementById('singleBody');
            tbody.innerHTML = '';
            
            results.forEach((res, index) => {
                const tr = document.createElement('tr');
                if (index === 0) tr.className = 'best';
                tr.innerHTML = `<td>${res.name}</td><td>${res.er.toLocaleString('ru-RU', {maximumFractionDigits:0})}</td><td>${res.enpv.toLocaleString('ru-RU', {maximumFractionDigits:0})}</td>`;
                tbody.appendChild(tr);
            });
            
            document.getElementById('singleTable').style.display = 'table';
            const bestDiv = document.getElementById('singleBest');
            bestDiv.style.display = 'block';
            bestDiv.innerHTML = `✅ Лучшая стратегия: ${results[0].name}`;
        }

        // Массовый расчет (CSV)
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const tbody = document.getElementById('batchBody');
                    tbody.innerHTML = '';
                    
                    results.data.forEach(row => {
                        const name = row['Актив'] || 'Без названия';
                        const nominal = parseFloat(row['Номинал']);
                        if (isNaN(nominal)) return;

                        const stratResults = processStrategies(getStrategies(nominal, 0.15), 0.15);
                        const best = stratResults[0];

                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td>${name}</td><td class="best">${best.name}</td><td>${best.er.toLocaleString('ru-RU', {maximumFractionDigits:0})}</td><td>${best.enpv.toLocaleString('ru-RU', {maximumFractionDigits:0})}</td>`;
                        tbody.appendChild(tr);
                    });
                    
                    document.getElementById('batchTable').style.display = 'table';
                }
            });
        });

        // Инициализация
        window.onload = calculateSingle;
    </script>
</body>
</html>
